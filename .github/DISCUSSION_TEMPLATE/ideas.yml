# `id: version` is prefilled by the extension (src/diagnostics.ts, proposeImprovement).
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. English or French, both are fine.
        Start from the problem you have, not from the solution: a well-described problem
        is worth ten vague ideas.

  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: What are you trying to do with Vespry, and what blocks you or wastes your time today?
      placeholder: |
        Example: "I want to archive a Discord server before it closes, then search a word
        across every channel without opening each HTML file."
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do today
      description: Your current workaround (another tool, a manual step, giving up)?
      placeholder: |
        Example: "I use grep on the command line, but it only works on the TXT export,
        not on the HTML that has everything."
    validations:
      required: false

  - type: textarea
    id: idea
    attributes:
      label: Your idea (optional)
      description: If you have a solution in mind, go ahead. Otherwise leave it empty; the problem is what matters.
      placeholder: |
        Example: "A search.html page in the zip with a local index of the messages, usable offline."
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Vespry version
      description: Shown in the extension popup.
      placeholder: "1.1.0"
    validations:
      required: false
