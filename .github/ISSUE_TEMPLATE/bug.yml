# The file name and the `id` of each field are a contract with the extension
# (src/diagnostics.ts, ISSUE_FORM): every published version prefills
# `?template=bug.yml&report=…&version=…`. Renaming them breaks prefill for all
# existing installs. Checked by src/issue-form.test.ts.
name: Bug report
description: Something in Vespry doesn't work as it should.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. English or French, both are fine.

        **This issue is public.** Never paste your Discord token, message content, server or channel names.
        The report generated by Vespry (*Report a problem* button) already masks them; read it once before sending.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
      placeholder: "I exported a server with 12 channels; it stopped at channel 4 with « rate-limited » and never resumed."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: false

  - type: textarea
    id: report
    attributes:
      label: Vespry report
      description: >-
        Filled in by the *Report a problem* button, which also copies the full report to your clipboard.
        If this box is empty or the report says lines were removed, paste the clipboard here.
      placeholder: "Version, browser, log and captured errors (already masked)."
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Vespry version
      description: Shown in the extension header.
      placeholder: "1.1.0"
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I checked that this issue contains no token, message content or private names.
          required: true
